<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background circle with gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>
  
  <!-- Inner circle -->
  <circle cx="64" cy="64" r="52" fill="url(#grad2)"/>
  
  <!-- Stylized "P" for Peyza -->
  <path d="M45 35 H60 Q75 35 75 50 Q75 65 60 65 H45 Z" fill="white" opacity="0.95"/>
  <rect x="45" y="35" width="8" height="58" rx="2" fill="white" opacity="0.95"/>
  
  <!-- Neural network dots -->
  <circle cx="82" cy="45" r="3" fill="white" opacity="0.8"/>
  <circle cx="92" cy="55" r="3" fill="white" opacity="0.8"/>
  <circle cx="88" cy="68" r="3" fill="white" opacity="0.8"/>
  <circle cx="78" cy="75" r="3" fill="white" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="70" y1="50" x2="82" y2="45" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="45" x2="92" y2="55" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="70" y1="60" x2="88" y2="68" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="88" y1="68" x2="78" y2="75" stroke="white" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
